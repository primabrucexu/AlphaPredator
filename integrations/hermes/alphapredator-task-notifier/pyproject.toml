[project]
name = "alphapredator-task-notifier"
version = "0.1.0"
description = "Hermes plugin that injects completed AlphaPredator task results into the originating session"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.entry-points."hermes_agent.plugins"]
alphapredator-task-notifier = "alphapredator_task_notifier"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--basetemp=tmp"
pythonpath = ["src"]
testpaths = ["tests"]
